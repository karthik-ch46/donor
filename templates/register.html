<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Donor Registration - Blood Donor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/register.css') }}">

</head>

<body>

    <div class="page-container">

        <div class="form-card wide-card">

            <div class="step">
                Step 2 of 3
            </div>

            <h1>Donor Registration</h1>

            <p class="subtitle">
                Register yourself as a blood donor
            </p>

            {% if error %}
                <div class="error-message">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" id="donorForm">

                <div class="two-column">

                    <div class="form-group">

                        <label>Name</label>

                        <input
                            type="text"
                            name="name"
                            value="{{ donor['name'] if donor else '' }}"
                            required>

                    </div>

                    <div class="form-group">

                        <label>Age</label>

                        <input
                            type="number"
                            name="age"
                            min="18"
                            max="100"
                            value="{{ donor['age'] if donor else '' }}"
                            required>

                    </div>

                    <div class="form-group">

                        <label>Gender</label>

                        <select name="gender" required>

                            <option value="">Select Gender</option>

                            <option value="Male"
                                {% if donor and donor['gender'] == 'Male' %}
                                selected
                                {% endif %}>
                                Male
                            </option>

                            <option value="Female"
                                {% if donor and donor['gender'] == 'Female' %}
                                selected
                                {% endif %}>
                                Female
                            </option>

                            <option value="Other"
                                {% if donor and donor['gender'] == 'Other' %}
                                selected
                                {% endif %}>
                                Other
                            </option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label>Mobile Number</label>

                        <input
                            type="tel"
                            name="mobile"
                            maxlength="10"
                            value="{{ donor['mobile'] if donor else session.get('mobile', '') }}"
                            required>

                    </div>

                </div>

                <div class="form-group">

                    <label>Blood Group</label>

                    <select name="blood_group" required>

                        <option value="">
                            Select Blood Group
                        </option>

                        {% for group in ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'] %}

                            <option value="{{ group }}"
                                {% if donor and donor['blood_group'] == group %}
                                selected
                                {% endif %}>
                                {{ group }}
                            </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="form-group">

                    <label>Address</label>

                    <textarea
                        name="address"
                        rows="3"
                        placeholder="Enter your complete address"
                        required>{{ donor['address'] if donor else '' }}</textarea>

                </div>

                <div class="two-column">

                    <div class="form-group">

                        <label>City</label>

                        <input
                            type="text"
                            name="city"
                            value="{{ donor['city'] if donor else '' }}"
                            required>

                    </div>

                    <div class="form-group">

                        <label>Pincode</label>

                        <input
                            type="text"
                            name="pincode"
                            maxlength="6"
                            value="{{ donor['pincode'] if donor else '' }}"
                            required>

                    </div>

                </div>

                <!-- LOCATION -->

                <div class="location-box">

                    <h3>📍 Location Tracking</h3>

                    <p>
                        Allow location access to save your current
                        location for donor matching.
                    </p>

                    <button
                        type="button"
                        class="location-button"
                        onclick="getLocation()">

                        📍 Get My Current Location

                    </button>

                    <p id="locationStatus">
                        Location not selected
                    </p>

                    <input
                        type="hidden"
                        id="latitude"
                        name="latitude"
                        value="{{ donor['latitude'] if donor and donor['latitude'] else '' }}">

                    <input
                        type="hidden"
                        id="longitude"
                        name="longitude"
                        value="{{ donor['longitude'] if donor and donor['longitude'] else '' }}">

                </div>

                <button
                    type="submit"
                    class="main-button">

                    Register as Donor & Continue →

                </button>

            </form>

        </div>

    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
{% include 'navbar.html' %}
</html>
